      - 'android/app/src/test/java/com/andriy/jarvis/NeuralSpeechPolicyTest.java'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Personal AI Worker tests (mocked OpenAI requests)
        run: node --test server/jarvis-ai-worker/test/*.test.mjs
      - name: Python server contract (without model download)
        run: python -m unittest discover -s server/jarvis-tts-server -p 'test_*.py' -v
      - name: Export package contract (no model download)
        run: python -m unittest discover -s tools/voice-export -p 'test_*.py' -v
      - name: Verify Android Clock alarm permission
        run: |
          grep -q 'android:name="com.android.alarm.permission.SET_ALARM"' android/app/src/main/AndroidManifest.xml
          ! grep -q 'android:name="android.permission.SET_ALARM"' android/app/src/main/AndroidManifest.xml
      - name: Watch7 voice picker and TTS application contract (no APK)
        run: |
          main=android/app/src/main/java/com/andriy/jarvis/MainActivity.java
          grep -Fq 'showWatchVoiceSettings();' "$main"
          grep -Fq 'showWatchVoiceChoices()' "$main"
          grep -Fq 'showWatchVoiceToneChoices()' "$main"
          grep -Fq 'WatchTtsVoiceChoice.PREF_VOICE_NAME' "$main"
          grep -Fq 'tts.setVoice(chosen)' "$main"
          grep -Fq '🔊 Вибрати голос Watch7' "$main"
          grep -Fq 'WatchTtsVoiceChoice.pitch(tone)' "$main"
          # A list-based AlertDialog must NOT also have a message body:
          # Android otherwise replaces the list and hides the choices.
          ! sed -n '/private void showWatchVoiceSettings()/,/private void showWatchVoiceChoices()/p' "$main" | grep -Fq '.setMessage(info)'
          ! sed -n '/private void showWatchVoiceChoices()/,/private void showWatchVoiceToneChoices()/p' "$main" | grep -Fq 'dialog.setMessage('
          grep -Fq '"ℹ Довідка про голоси"' "$main"
          grep -Fq 'choices[choices.length-1]="⚙ Додати українські голоси у Wear OS";' "$main"
          grep -Fq 'if(index==choices.length-1)' "$main"
          ! grep -Fq '.setTitle("Голос Android Watch7")' "$main"
      - name: Watch7 Spotify song UP-only navigation contract (no APK)
        run: |
          controller=android/app/src/main/java/com/andriy/jarvis/JarvisWatchSpotifyController.java
          screen=android/app/src/main/java/com/andriy/jarvis/JarvisWatchScreenService.java
          rules=android/app/src/main/java/com/andriy/jarvis/JarvisWatchUiRules.java
          grep -Fq 'case REVEAL_NAV:' "$screen"
          grep -Fq 'return playlist?service.spotifySwipeDown(completion):' "$screen"
          grep -Fq 'service.spotifySwipeUp(completion);' "$screen"
          grep -Fq 'WatchSearchRecovery.UP_AGAIN' "$controller"
          grep -Fq 'WatchSearchRecovery { NONE, UP_AGAIN, EXHAUSTED }' "$rules"
          grep -Fq 'p.moveTo(m.widthPixels*.50f,m.heightPixels*.85f);' "$screen"
          grep -Fq 'p.lineTo(m.widthPixels*.50f,m.heightPixels*.16f);' "$screen"
          grep -Fq 'done(true,"Плейлист' "$controller"
          ! grep -Eq 'SWIPE_HOME|SEARCH_RECOVER_RIGHT|SEARCH_RECOVER_DOWN|RETURN_FROM_SEARCH_PLAYLIST|spotifySwipeHome|spotifyRevealNavigation' "$controller" "$screen"
      - name: Watch7 Spotify IME Search preserves letters (no APK)
        run: |
          service=android/app/src/main/java/com/andriy/jarvis/JarvisWatchScreenService.java
          controller=android/app/src/main/java/com/andriy/jarvis/JarvisWatchSpotifyController.java
          xml=android/app/src/main/res/xml/jarvis_watch_accessibility.xml
          grep -Fq 'flagInputMethodEditor' "$xml"
          grep -Fq 'connection.commitText(title,1,null)' "$service"
          grep -Fq 'connection.performEditorAction(action)' "$service"
          grep -Fq 'spotifyLiveInputMethod()' "$service"
          grep -Fq 'spotifySubmittedQueryCorrupted(title)' "$controller"
          ! sed -n '/private Result spotifySubmitQuery(/,/private static boolean spotifyTitleMatches/p' "$service" | grep -Fq 'ACTION_IME_ENTER'
      - name: Three-device security and shared Pixel notes contracts (no APK)
        run: |
          base=android/app/src/main/java/com/andriy/jarvis
          grep -Fq 'if (!cloudRemote && handleMacro(phone,raw,completion)) return;' "$base/JarvisWearPhoneAssistant.java"
          grep -Fq 'if(cloudRemote) {' "$base/JarvisWearPhoneAssistant.java"
          grep -Fq 'JarvisDeviceRelayRules.permittedRemotePhone(raw)' "$base/JarvisWearPhoneAssistant.java"
          grep -Fq 'private static String phoneNotes(Context phone,String raw,String normalized)' "$base/JarvisWearPhoneAssistant.java"
          grep -Fq 'notes.clear();' "$base/MainActivity.java"
          grep -Fq 'JarvisDeviceTargetSession.get()' "$base/FloatingJarvisService.java"
          grep -Fq 'JarvisDeviceRelay.watchRequestPath()' "$base/JarvisWearMessageReceiver.java"
          grep -Fq 'String safeDetail=detail==null?' "$base/JarvisDeviceRelay.java"
      - name: Watch7 Spotify fresh-task launch without losing next result (no APK)
        run: |
          watch=android/app/src/main/java/com/andriy/jarvis
          grep -Fq 'JarvisWatchSpotifyLaunchPolicy.freshTaskForMusic(kind,followup)' "$watch/JarvisWatchSpotifyController.java"
          grep -Fq 'JarvisWatchSpotifyLaunchPolicy.freshTaskForOpenCommand()' "$watch/JarvisWatchLocalController.java"
          grep -Fq 'Intent.FLAG_ACTIVITY_CLEAR_TASK' "$watch/JarvisWatchSpotifyController.java"
          grep -Fq 'Intent.FLAG_ACTIVITY_CLEAR_TASK' "$watch/JarvisWatchLocalController.java"
          grep -Fq 'Intent.FLAG_ACTIVITY_REORDER_TO_FRONT' "$watch/JarvisWatchSpotifyController.java"
          ! grep -Fq 'SWIPE_HOME' "$watch/JarvisWatchSpotifyController.java"
      - name: Spotify Remote Pixel-to-Watch7 alias snapshot contract (no APK)
        run: |
          base=android/app/src/main/java/com/andriy/jarvis
          grep -Fq 'SpotifyPlaylistSync.publishFromPhone(this);' "$base/MainActivity.java"
          grep -Fq 'SpotifyPlaylistSync.publishFromPhone(this);' "$base/SpotifyDirectSettingsActivity.java"
          grep -Fq 'SpotifyPlaylistSync.resolveOnWatch(context,kind,title' "$base/JarvisWatchSpotifyController.java"
          grep -Fq 'SpotifyPlaylistSyncRules.playlistLink(syncedPlaylistUri)' "$base/JarvisWatchSpotifyController.java"
          grep -Fq 'spotifySelectedPlaylistPageReady(' "$base/JarvisWatchSpotifyController.java"
          grep -Fq 'android:name=".JarvisWearSpotifySyncReceiver"' android/app/src/main/AndroidManifest.xml
          grep -Fq 'android:path="/jarvis/spotify-playlists/v1"' android/app/src/main/AndroidManifest.xml
      - name: Watch7 Maps gentle UP then pedestrian card regression (no APK)
        run: |
          controller=android/app/src/main/java/com/andriy/jarvis/JarvisWatchMapsController.java
          screen=android/app/src/main/java/com/andriy/jarvis/JarvisWatchScreenService.java
          rules=android/app/src/main/java/com/andriy/jarvis/JarvisWatchUiRules.java
          grep -Fq 'destinationSelected=true;' "$controller"
          grep -Fq 'allowShortRouteSwipe(' "$controller"
          grep -Fq 'shortSwipeCompleted=true;' "$controller"
          grep -Fq 'mapsRevealWalkingCard(root,completion)' "$screen"
          grep -Fq 'mapsTapWalkingCard(root,completion)' "$screen"
          grep -Fq 'MAPS_WALKING_AFTER_SWIPE_Y' "$screen"
          grep -Fq 'mapsRouteCardsLikely(' "$screen"
          ! grep -Fq 'if(root==null || !mapsRouteChoices(root))' "$screen"
      - name: Spotify Pixel first-result gates (no APK)
        run: |
          service=android/app/src/main/java/com/andriy/jarvis/ScreenControlAccessibilityService.java
          flow=android/app/src/main/java/com/andriy/jarvis/SpotifyPlaybackController.java
          grep -Fq 'querySubmittedByJarvis' "$service" "$flow"
          grep -Fq 'spotifyKeyboardWindowVisible()' "$service"
          grep -Fq 'SpotifyVisibleResultOrder.combine(mixed,untyped' "$service"
          grep -Fq 'SPOTIFY_RESULT' android/app/src/main/java/com/andriy/jarvis/JarvisDiagnostics.java
          ! grep -Fq 'if(root==null || spotifyOwnsInputMethod() ||' "$service"
      - name: Java policy contracts (without APK)
        run: |
          mkdir -p /tmp/jarvis-voice-tests
