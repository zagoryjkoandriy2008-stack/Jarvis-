name: JARVIS Android compile-only (NO APK, EXE, install, or deploy)
# This task compiles Java and generated Android resources. It DOES NOT assemble
# or publish any application package, run a release build, or install an app.
on:
  push:
    paths:
      - 'android/app/src/main/java/**'
      - 'android/app/src/main/AndroidManifest.xml'
      - 'android/app/build.gradle'
      - '.github/workflows/jarvis-android-java-compile-only.yml'
  pull_request:
    branches: [feature/windows-pixel-ui-parity-20261123, feature/jarvis-windows-0.2.1-build-20261125]
    paths:
      - 'android/app/src/main/java/**'
      - 'tools/qa/JarvisWatchSpotifySubmitRulesContract.java'
      - '.github/workflows/jarvis-android-java-compile-only.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android-java-only:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12'
      # Ubuntu hosted runner already has current cmdline-tools. Avoid
      # setup-android's deprecated 'sdkmanager tools' package installation.
      - name: Install Android API 36 from hosted SDK (no emulator)
        shell: bash
        run: |
          set -e
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::Android SDK command-line manager is unavailable"
            exit 1
          fi
          printf 'Using SDK manager: %s\n' "$SDKMANAGER"
          (yes | "$SDKMANAGER" --licenses > /dev/null) || true
          "$SDKMANAGER" --install 'platforms;android-36' 'build-tools;36.0.0'
          test -f "$ANDROID_HOME/platforms/android-36/android.jar"
      - name: Watch7 Spotify IME Search-key policy regressions (JDK only)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/jarvis-spotify-submit
          javac -d /tmp/jarvis-spotify-submit \
            android/app/src/main/java/com/andriy/jarvis/JarvisWatchSpotifySubmitRules.java \
            tools/qa/JarvisWatchSpotifySubmitRulesContract.java
          java -cp /tmp/jarvis-spotify-submit \
            com.andriy.jarvis.JarvisWatchSpotifySubmitRulesContract
      - name: Watch7 Spotify Connect phone-target regressions (JDK only)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/jarvis-spotify-connect
          javac -d /tmp/jarvis-spotify-connect \
            android/app/src/main/java/com/andriy/jarvis/JarvisWatchSpotifyPhoneRules.java \
            tools/qa/JarvisWatchSpotifyPhoneRulesContract.java
          java -cp /tmp/jarvis-spotify-connect \
            com.andriy.jarvis.JarvisWatchSpotifyPhoneRulesContract
      - name: Check bounded Watch7 command wake-lock and completion cleanup
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          manifest=Path('android/app/src/main/AndroidManifest.xml').read_text()
          controller=Path('android/app/src/main/java/com/andriy/jarvis/JarvisWatchLocalController.java').read_text()
          guard=Path('android/app/src/main/java/com/andriy/jarvis/JarvisWatchCommandScreenGuard.java').read_text()
          spotify=Path('android/app/src/main/java/com/andriy/jarvis/JarvisWatchSpotifyController.java').read_text()
          assert 'android.permission.WAKE_LOCK' in manifest
          assert 'JarvisWatchCommandScreenGuard.begin(watch);' in controller
          assert 'JarvisWatchCommandScreenGuard.end();' in controller
          assert 'lock.acquire(MAX_HOLD_MS)' in guard
          assert 'SCREEN_BRIGHT_WAKE_LOCK' in guard
          assert 'SpotifyStep.SELECT_PHONE' in spotify
          assert 'beginPhoneSelection();' in spotify
          assert 'PHONE_TARGET_TAPPED' in spotify
          assert 'case OPEN_DEVICE_PICKER:' in spotify
          print('Watch7 screen guard and Spotify target contract: passed')
          PY
      - name: Compile Java and Android resources only (NEVER assemble APK)
        run: |
          gradle -p android :app:compileDebugJavaWithJavac --no-daemon --stacktrace
      - name: Verify that no Android package was produced
        if: always()
        run: |
          if find android/app/build -type f \( -iname '*.apk' -o -iname '*.aab' -o -iname '*.exe' \) 2>/dev/null | grep -q .; then
            echo "::error::Unexpected packaged application. Do not publish."
            exit 1
          fi
          echo 'No APK, AAB or EXE generated; Java compile-only check complete.'
