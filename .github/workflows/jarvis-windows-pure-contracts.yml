name: JARVIS Windows pure contracts (no app builds)
# Compile only the standalone test DLL, never the WPF executable or APK.
# No installer, published EXE, release artifact or deployment is produced.
on:
  push:
    paths:
      - 'windows/Jarvis.Windows/Core/**'
      - 'windows/Jarvis.Windows.Tests/**'
      - '.github/workflows/jarvis-windows-pure-contracts.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pure-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Compile isolated Windows-independent contract DLL (not WPF/EXE)
        run: dotnet build windows/Jarvis.Windows.Tests/Jarvis.Windows.Tests.csproj --configuration Release -p:UseAppHost=false
      - name: Run parser, permissions, relay and file-exchange contracts
        run: dotnet windows/Jarvis.Windows.Tests/bin/Release/net8.0/Jarvis.Windows.Tests.dll
