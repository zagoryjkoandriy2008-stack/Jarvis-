name: JARVIS Pixel Watch7 Windows build on request
on:
  push:
    branches: [feature/jarvis-installable-builds-20261123]
    paths: [.github/workflows/jarvis-installable-builds-20261123.yml]
  pull_request:
    branches: [feature/jarvis-cross-device-p0-p8-20261122]
    paths: [.github/workflows/jarvis-installable-builds-20261123.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Worker tests without deploy
        working-directory: server/jarvis-ai-worker
        run: npm test
  android:
    needs: contracts
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12'
      - name: Install Android API 36
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -1)"
          test -n "$SDKMANAGER"
          (yes | "$SDKMANAGER" --licenses > /dev/null) || true
          "$SDKMANAGER" --install 'platforms;android-36' 'build-tools;36.0.0'
      - name: Build original signed stable or isolated preview APK
        shell: bash
        env:
          JARVIS_SIGNING_KEYSTORE_BASE64: ${{ secrets.JARVIS_SIGNING_KEYSTORE_BASE64 }}
          JARVIS_RELEASE_STORE_PASSWORD: ${{ secrets.JARVIS_RELEASE_STORE_PASSWORD }}
          JARVIS_RELEASE_KEY_ALIAS: ${{ secrets.JARVIS_RELEASE_KEY_ALIAS }}
          JARVIS_RELEASE_KEY_PASSWORD: ${{ secrets.JARVIS_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p deliverables
          if [[ -n "$JARVIS_SIGNING_KEYSTORE_BASE64" && -n "$JARVIS_RELEASE_STORE_PASSWORD" && -n "$JARVIS_RELEASE_KEY_ALIAS" && -n "$JARVIS_RELEASE_KEY_PASSWORD" ]]; then
            export JARVIS_RELEASE_STORE_FILE="$RUNNER_TEMP/jarvis-stable.jks"
            printf '%s' "$JARVIS_SIGNING_KEYSTORE_BASE64" | base64 --decode > "$JARVIS_RELEASE_STORE_FILE"
            chmod 600 "$JARVIS_RELEASE_STORE_FILE"
            gradle -p android :app:assembleRelease --no-daemon --stacktrace
            apk="android/app/build/outputs/apk/release/app-release.apk"
            label=stable
            package=com.andriy.jarvis.stable
            expected="$(tr -cd '0123456789abcdefABCDEF' < android/RELEASE-CERT-SHA256.txt | tr 'A-F' 'a-f')"
            actual="$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$apk" | awk -F ': ' '/Signer #1 certificate SHA-256 digest/ {print $2; exit}' | tr 'A-F' 'a-f' | tr -d ':[:space:]')"
            if [[ "${#expected}" != 64 || "$actual" != "$expected" ]]; then
              echo "::error::Stable APK certificate differs from original"; exit 1
            fi
            rm -f "$JARVIS_RELEASE_STORE_FILE"
          else
            echo "::warning::Stable key missing; preview cannot upgrade installed stable app."
            gradle -p android :app:assembleDebug --no-daemon --stacktrace
            apk="android/app/build/outputs/apk/debug/app-debug.apk"
            label=preview
            package=com.andriy.jarvis.preview
          fi
          test -s "$apk"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk" | grep -F "name='$package'"
          cp "$apk" "deliverables/JARVIS-Pixel-0.1.47-$label.apk"
          cp "$apk" "deliverables/JARVIS-Watch7-0.1.47-$label.apk"
          {
            echo "v0.1.47+57; app ID $package; signature $label"
            echo "Both files are identical universal APKs for Pixel and Galaxy Watch7."
            echo "Preview installs separately; do not uninstall your existing stable JARVIS."
            echo "No Worker deploy or physical device tests. Commit: $GITHUB_SHA"
            sha256sum deliverables/*.apk
          } > deliverables/ANDROID-BUILD-INFO.txt
      - uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Pixel-Watch7-APK
          path: deliverables/
          if-no-files-found: error
          retention-days: 14
  windows:
    needs: contracts
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build portable Windows x64 (ZIP only, no deploy)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          dotnet publish windows/Jarvis.Windows/Jarvis.Windows.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:DebugType=None -p:DebugSymbols=false --output "$env:RUNNER_TEMP\jarvis-publish"
          if ($LASTEXITCODE -ne 0) { throw "Windows publish failed" }
          if (-not (Test-Path "$env:RUNNER_TEMP\jarvis-publish\Jarvis.Windows.exe")) { throw "Jarvis.Windows.exe missing" }
          New-Item -ItemType Directory -Path deliverables -Force | Out-Null
          Compress-Archive -Path "$env:RUNNER_TEMP\jarvis-publish\*" -DestinationPath "deliverables\JARVIS-Windows-0.2.0-preview-win-x64.zip" -CompressionLevel Optimal
          @("Windows 0.2.0 portable preview", "Commit: $env:GITHUB_SHA", "Extract ZIP and run Jarvis.Windows.exe", "No Worker deploy or physical QA") | Out-File -Encoding utf8 deliverables\WINDOWS-BUILD-INFO.txt
          Get-FileHash deliverables\JARVIS-Windows-0.2.0-preview-win-x64.zip -Algorithm SHA256 | Format-List
      - uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Windows-x64-ZIP
          path: deliverables/
          if-no-files-found: error
          retention-days: 14
