name: JARVIS Windows WPF compile-only DLL (NO EXE/APK)
on:
  push:
    paths:
      - 'windows/Jarvis.Windows/**'
      - '.github/workflows/jarvis-windows-xaml-dll-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  wpf-compile:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Validate XAML and compile classes to library only (no Windows EXE)
        shell: pwsh
        run: |
          dotnet build windows/Jarvis.Windows/Jarvis.Windows.csproj --configuration Release -p:OutputType=Library -p:UseAppHost=false -p:GenerateRuntimeConfigurationFiles=false -p:PublishReadyToRun=false
          if ($LASTEXITCODE -ne 0) { throw "Windows WPF source compile failed" }
          if (Test-Path windows/Jarvis.Windows/bin/Release/net8.0-windows/Jarvis.Windows.exe) {
            throw "Safety rule: no EXE must be created"
          }
          if (-not (Test-Path windows/Jarvis.Windows/bin/Release/net8.0-windows/Jarvis.Windows.dll)) {
            throw "Expected ephemeral source validation DLL was not created"
          }
