name: JARVIS Cloudflare Worker / manual deploy
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify relay and AI contracts before production changes
        working-directory: server/jarvis-ai-worker
        run: |
          npm install --no-audit --no-fund
          npm test
      - name: Require Cloudflare secrets in GitHub Actions
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo 'Configure CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in GitHub Actions secrets.' >&2
            exit 1
          fi
      - name: Deploy authorized JARVIS AI and private device relay to Cloudflare
        working-directory: server/jarvis-ai-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
      - name: Post-deploy notes
        run: |
          echo 'Worker deployment command finished. Confirm HTTPS /health and /chat in the Cloudflare dashboard.'
          echo 'Existing Cloudflare Worker secrets OPENAI_API_KEY and JARVIS_CLIENT_TOKEN must remain configured.'
