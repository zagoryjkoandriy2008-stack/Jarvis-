name = "jarvis-personal-ai"
main = "src/index.mjs"
compatibility_date = "2026-11-09"
workers_dev = true

[vars]
OPENAI_MODEL = "gpt-6-luna"

# Private synchronized command relay. Cloudflare Durable Objects requires
# deployment; pushing to GitHub alone does NOT activate it.
[[durable_objects.bindings]]
name = "DEVICE_RELAY"
class_name = "DeviceRelay"

[[migrations]]
tag = "device-relay-v1"
new_sqlite_classes = ["DeviceRelay"]
